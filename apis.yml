aid: linguatrip
name: Linguatrip
description: >-
  Linguatrip is a language-education and language-travel company founded
  in 2014 and backed by 500 Global. It operates two connected businesses: a booking
  marketplace for accredited language schools abroad — covering course selection,
  accommodation, airport transfers and visa support across countries including the
  United Kingdom, Malta and the United Arab Emirates — and its own online English
  school offering 25+ self-paced courses, one-to-one tutoring, speaking clubs and
  exam preparation for IELTS, TOEFL, GMAT, GRE and SAT. It also provides higher-education
  placement consulting for US, UK and Canadian universities. Linguatrip publishes
  no public API, developer portal or SDKs; its surfaces are consumer web properties
  in four languages with pricing in 18 currencies.
